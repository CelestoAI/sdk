name: Pi Extension Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            ts/package-lock.json
            pi/package-lock.json

      - name: Install TypeScript SDK dependencies
        working-directory: ts
        run: npm ci

      - name: Build TypeScript SDK
        working-directory: ts
        run: npm run build

      - name: Install Pi extension dependencies
        working-directory: pi
        run: npm ci

      - name: Check Pi extension
        working-directory: pi
        run: npm run check
